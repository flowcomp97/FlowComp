[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "flowcomp"
version = "0.1.0"
description = "Core research code for FlowComp."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "accelerate>=0.27",
  "datasets>=2.18",
  "numpy>=1.24",
  "torch>=2.1",
  "tqdm>=4.66",
  "transformers>=4.40",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
